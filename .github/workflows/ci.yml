name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에서 새 푸시가 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 테스트는 진짜 PostgreSQL을 쓴다. application.yml 기본값(localhost:5433, ssen/ssen/ssen)과 같게 맞춘다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ssen
          POSTGRES_USER: ssen
          POSTGRES_PASSWORD: ssen
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ssen -d ssen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # 배포가 Dockerfile로 빌드되므로 이미지가 깨지지 않는지 확인한다(푸시하지 않는다).
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ssen-server:ci .
