server:
  # Railway 같은 호스팅이 넣어 주는 PORT를 쓴다. 없으면 8080.
  port: ${PORT:8080}

spring:
  application:
    name: ssen-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ssen}
    username: ${DB_USERNAME:ssen}
    password: ${DB_PASSWORD:ssen}
    hikari:
      # 기본 30초는 DB가 끊겼을 때 요청이 너무 오래 매달린다. 헬스체크(/api/health/db)도 이 시간 안에 503을 돌려준다.
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ""
  auth:
    max-attempts: 5
    attempt-window-millis: 300000
  teacher:
    # 교사 계정(학교|이름|번호4자리를 ; 또는 줄바꿈으로 구분). 시작할 때 DB에 등록한다.
    accounts: ${TEACHER_ACCOUNTS:}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
logging:
  level:
    org.hibernate.SQL: debug

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string}
  teacher:
    accounts: ${TEACHER_ACCOUNTS:테스트학원|테스트교사|0000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8099,http://localhost:19006}

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    clean-disabled: true
logging:
  level:
    root: info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
